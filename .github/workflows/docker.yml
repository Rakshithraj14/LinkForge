name: Docker Hub

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install fastapi python-multipart
      - run: python test_app.py

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # latest + the commit, plus the version on a v* tag (v1.2.0 -> :v1.2.0)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linkforge:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linkforge:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('{0}/linkforge:{1}', secrets.DOCKERHUB_USERNAME, github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
